[package]
name = "claude-pill"
version = "0.1.0"
description = "Menu bar approval widget for Claude Code"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde_json = "1"
tiny_http = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[profile.release]
strip = true
lto = true
